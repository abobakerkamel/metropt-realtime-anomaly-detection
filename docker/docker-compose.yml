services:
  broker:
    image: apache/kafka:3.9.1
    hostname: broker
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:19092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    networks: [backend]

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      broker:
        condition: service_healthy
    command: >
      bash -lc "/opt/kafka/bin/kafka-topics.sh
      --bootstrap-server broker:19092
      --create --if-not-exists
      --topic metropt-sensors
      --partitions 3
      --replication-factor 1"
    networks: [backend]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: metropt
      POSTGRES_PASSWORD: metropt
      POSTGRES_DB: metropt
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metropt -d metropt"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]

  spark-master:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8080:8080"
    environment:
      SPARK_NO_DAEMONIZE: "true"
    volumes:
      - ..:/opt/project
      - spark-checkpoints:/opt/spark/checkpoints
      - spark-ivy:/home/spark/.ivy2
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [backend]

  spark-worker-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--webui-port", "8081"]
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    volumes:
      - ..:/opt/project
      - spark-checkpoints:/opt/spark/checkpoints
      - spark-ivy:/home/spark/.ivy2
    depends_on: [spark-master]
    networks: [backend]

  spark-worker-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--webui-port", "8082"]
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    volumes:
      - ..:/opt/project
      - spark-checkpoints:/opt/spark/checkpoints
      - spark-ivy:/home/spark/.ivy2
    depends_on: [spark-master]
    networks: [backend]

  spark:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    command: ["bash", "-lc", "sleep infinity"]
    ports:
      - "127.0.0.1:4040:4040"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: metropt
      POSTGRES_USER: metropt
      POSTGRES_PASSWORD: metropt
    volumes:
      - ..:/opt/project
      - spark-checkpoints:/opt/spark/checkpoints
      - spark-ivy:/home/spark/.ivy2
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
    networks: [backend]

  superset-db-init:
    image: postgres:16
    environment:
      PGPASSWORD: metropt
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -lc "psql -h postgres -U metropt -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname='superset'\" | grep -q 1 || psql -h postgres -U metropt -d postgres -c 'CREATE DATABASE superset'"
    networks: [backend]

  superset-init:
    image: apache/superset:6.1.0
    user: root
    environment:
      SUPERSET_SECRET_KEY: metropt-demo-secret-key-change-me
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://metropt:metropt@postgres:5432/superset
    depends_on:
      superset-db-init:
        condition: service_completed_successfully
    command: >
      bash -lc "pip install --quiet psycopg2-binary &&
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin || true &&
      superset init"
    volumes:
      - superset-home:/app/superset_home
    networks: [backend]

  superset:
    image: apache/superset:6.1.0
    user: root
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      SUPERSET_SECRET_KEY: metropt-demo-secret-key-change-me
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://metropt:metropt@postgres:5432/superset
    depends_on:
      superset-init:
        condition: service_completed_successfully
    command: >
      bash -lc "pip install --quiet psycopg2-binary && superset run -h 0.0.0.0 -p 8088 --with-threads"
    volumes:
      - superset-home:/app/superset_home
    networks: [backend]

networks:
  backend:
    name: metropt-backend

volumes:
  kafka-data:
  postgres-data:
  spark-checkpoints:
  spark-ivy:
  superset-home:
